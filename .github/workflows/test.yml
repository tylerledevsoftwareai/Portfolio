name: CI/CD - Test & Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 🧪 Run Unit & Integration Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Unit Tests
        run: npm test

      - name: Run Code Coverage Report
        run: npm run test:coverage

      - name: Run Live Production API Integration Tests
        env:
          SOM_API_URL: ${{ secrets.SOM_API_URL }}
          SOM_API_KEY: ${{ secrets.SOM_API_KEY }}
          WASTE_API_URL: ${{ secrets.WASTE_API_URL }}
          WASTE_API_KEY: ${{ secrets.WASTE_API_KEY }}
        run: |
          if [ -n "$SOM_API_KEY" ]; then
            npm run test:e2e
          else
            echo "Secrets not configured in GitHub UI yet. Skipping live integration tests."
          fi

  deploy:
    name: 🚀 Deploy to Vercel (Gated on Passing Tests)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Vercel Production
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel --prod --token=$VERCEL_TOKEN --yes
