name: CI - Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Unit Tests
        run: npm test

      - name: Run Code Coverage Report
        run: npm run test:coverage

      - name: Run Live Production API Integration Tests
        env:
          SOM_API_URL: ${{ secrets.SOM_API_URL || 'https://som-color-extractor.onrender.com/api/v1/palette' }}
          SOM_API_KEY: ${{ secrets.SOM_API_KEY}}
          WASTE_API_URL: ${{ secrets.WASTE_API_URL || 'https://waste-classification-api-3dd9.onrender.com/api/v1/classify' }}
          WASTE_API_KEY: ${{ secrets.WASTE_API_KEY}}
        run: npm run test:e2e
